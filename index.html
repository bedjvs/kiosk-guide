<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>키오스크 도우미</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
:root {
  --blue:#1a6fd4; --blue-dark:#0f4a9c;
  --yellow:#FFD600; --green:#22c55e;
  --dark:rgba(0,0,0,0.88);
  --fs: 1rem; /* base — scaled by JS */
}
html,body { width:100%; height:100%; overflow:hidden; font-family:'Noto Sans KR',sans-serif; background:#000; }

/* ─ BRIGHTNESS OVERLAY ─ */
#brightnessOverlay {
  position:fixed; inset:0; z-index:1;
  background:black; opacity:0; pointer-events:none; transition:opacity .2s;
}

/* ─ CAMERA ─ */
#cameraLayer { position:fixed; inset:0; z-index:0; }
#videoEl { width:100%; height:100%; object-fit:cover; }
#canvasEl { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

/* ─ START SCREEN ─ */
#startScreen {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(160deg,#0f1f3d,#1a3a6b);
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:24px; padding:40px 24px; text-align:center;
}
.app-icon { width:90px; height:90px; border-radius:24px; background:var(--blue);
  display:flex; align-items:center; justify-content:center; font-size:3rem;
  box-shadow:0 8px 32px rgba(26,111,212,.5); }
#startScreen h1 { color:white; font-size:2rem; font-weight:900; line-height:1.3; }
#startScreen p  { color:rgba(255,255,255,.75); font-size:1.1rem; line-height:1.75; }

/* 상황 선택 */
.situation-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; width:100%; max-width:360px; }
.sit-btn {
  background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2);
  border-radius:14px; padding:14px 10px; color:white;
  font-size:1rem; font-weight:700; font-family:inherit; cursor:pointer;
  transition:all .15s; display:flex; flex-direction:column; align-items:center; gap:6px;
  min-height:72px;
}
.sit-btn:hover,.sit-btn.active { background:var(--blue); border-color:var(--blue); }
.sit-btn .s-icon { font-size:1.6rem; }

#startBtn {
  background:var(--blue); color:white; border:none; border-radius:16px;
  padding:20px 0; width:100%; max-width:360px;
  font-size:1.25rem; font-weight:900; font-family:inherit; cursor:pointer;
  box-shadow:0 6px 24px rgba(26,111,212,.4); transition:transform .15s;
}
#startBtn:hover { transform:scale(1.02); }

/* ─ NO CAM ─ */
#noCamMsg {
  position:fixed; inset:0; z-index:5; background:#111; display:none;
  align-items:center; justify-content:center;
  flex-direction:column; gap:16px; text-align:center; padding:32px;
}
#noCamMsg p { color:rgba(255,255,255,.6); font-size:1.1rem; line-height:1.7; }

/* ─ UI OVERLAY ─ */
#uiOverlay { position:fixed; inset:0; z-index:10; pointer-events:none; display:none; }

/* TOP BAR */
#topBar {
  position:absolute; top:0; left:0; right:0; padding:12px 14px;
  display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent);
  pointer-events:auto; gap:8px;
}
.app-name { color:white; font-size:1rem; font-weight:900; display:flex; align-items:center; gap:8px; flex-shrink:0; }
.live-dot { width:10px; height:10px; border-radius:50%; background:var(--green);
  box-shadow:0 0 8px var(--green); animation:blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
#statusBadge {
  background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.2);
  border-radius:99px; padding:5px 12px; color:rgba(255,255,255,.85); font-size:.9rem; flex-shrink:0;
}

/* TOP RIGHT CONTROLS */
#topControls { display:flex; gap:8px; pointer-events:auto; }
.top-ctrl-btn {
  width:42px; height:42px; border-radius:12px; border:none;
  background:rgba(255,255,255,.15); color:white; font-size:1.1rem;
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(6px);
}

/* ─ AI BUBBLE ─ */
#aiBubble {
  position:absolute; top:68px; left:12px; right:12px;
  background:var(--dark); border-radius:20px; border-top-left-radius:5px;
  padding:16px 18px; border-left:4px solid var(--blue);
  pointer-events:auto; display:none; animation:slideDown .3s ease;
}
@keyframes slideDown { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }
.bubble-hd { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.b-avatar { width:30px; height:30px; background:var(--blue); border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0; }
.b-label { color:var(--blue); font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.5px; }
.bubble-actions { display:flex; gap:6px; margin-top:10px; }
.b-act-btn {
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2);
  border-radius:8px; padding:6px 12px; color:white; font-size:.88rem;
  font-family:inherit; cursor:pointer; transition:all .15s;
}
.b-act-btn:hover { background:var(--blue); }
#bubbleText { color:white; font-size:1.15rem; line-height:1.7; word-break:keep-all; white-space:pre-line; }

/* ─ POINTER ─ */
#aiPointer {
  position:absolute; display:none; flex-direction:column; align-items:center;
  pointer-events:none; z-index:20; animation:ptrBounce 1s ease-in-out infinite;
}
@keyframes ptrBounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
.ptr-finger { font-size:2.8rem; filter:drop-shadow(0 2px 8px rgba(0,0,0,.7)); }
.ptr-ring {
  width:58px; height:58px; border-radius:50%;
  border:3px solid var(--yellow);
  box-shadow:0 0 0 4px rgba(255,214,0,.3),0 0 20px rgba(255,214,0,.5);
  position:absolute; bottom:-4px; animation:ringPulse 1s ease-in-out infinite;
}
@keyframes ringPulse { 0%,100%{transform:scale(1);opacity:1} 50%{transform:scale(1.15);opacity:.7} }

/* ─ HISTORY PANEL ─ */
#historyPanel {
  position:absolute; top:68px; left:12px; right:12px; bottom:160px;
  background:rgba(0,0,0,.9); border-radius:16px;
  overflow-y:auto; padding:12px; display:none; flex-direction:column; gap:10px;
  pointer-events:auto;
}
#historyPanel::-webkit-scrollbar { width:4px; }
#historyPanel::-webkit-scrollbar-thumb { background:rgba(255,255,255,.2); border-radius:2px; }
.hist-item {
  background:rgba(255,255,255,.07); border-radius:12px; padding:12px 14px;
  border-left:3px solid var(--blue);
}
.hist-time { color:rgba(255,255,255,.4); font-size:.78rem; margin-bottom:4px; }
.hist-text { color:white; font-size:1rem; line-height:1.6; white-space:pre-line; }
.hist-replay { background:none; border:1px solid rgba(255,255,255,.2); border-radius:8px;
  color:rgba(255,255,255,.6); font-size:.82rem; font-family:inherit;
  padding:5px 10px; cursor:pointer; margin-top:6px; }
.hist-replay:hover { background:var(--blue); color:white; border-color:var(--blue); }

/* ─ BRIGHTNESS SLIDER ─ */
#brightnessPanel {
  position:absolute; top:68px; left:12px; right:12px;
  background:var(--dark); border-radius:16px; padding:16px 20px;
  pointer-events:auto; display:none; animation:slideDown .2s ease;
}
.br-label { color:white; font-size:1rem; font-weight:700; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
#brightnessSlider {
  width:100%; height:8px; -webkit-appearance:none; appearance:none;
  border-radius:4px; background:rgba(255,255,255,.2); outline:none; cursor:pointer;
}
#brightnessSlider::-webkit-slider-thumb {
  -webkit-appearance:none; width:28px; height:28px; border-radius:50%;
  background:var(--yellow); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.br-close { float:right; background:none; border:none; color:rgba(255,255,255,.5); font-size:1.2rem; cursor:pointer; }

/* ─ BOTTOM AREA ─ */
#bottomArea {
  position:absolute; bottom:0; left:0; right:0;
  background:linear-gradient(to top,rgba(0,0,0,.92),rgba(0,0,0,.6) 80%,transparent);
  padding:10px 12px 24px; pointer-events:auto;
}

/* CHIPS */
#questionChips { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:10px; }
.q-chip {
  background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.22);
  border-radius:99px; padding:9px 16px; color:white;
  font-size:1rem; font-weight:600; cursor:pointer; font-family:inherit;
  transition:all .15s; min-height:40px; display:flex; align-items:center; gap:5px;
}
.q-chip:hover { background:var(--blue); border-color:var(--blue); }
.q-chip.ai-chip { border-color:rgba(255,214,0,.45); background:rgba(255,214,0,.08); }

/* MAIN BUTTONS */
#mainBtns { display:flex; gap:8px; margin-bottom:8px; }
#analyzeBtn {
  flex:1.6; background:var(--blue); color:white; border:none;
  border-radius:14px; padding:17px; font-size:1.1rem; font-weight:900; font-family:inherit;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 4px 16px rgba(26,111,212,.4); transition:all .15s; min-height:56px;
}
#analyzeBtn:disabled { background:rgba(255,255,255,.2); box-shadow:none; cursor:not-allowed; }
.btn-spin { width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35);
  border-top-color:white; border-radius:50%; animation:spin .7s linear infinite; display:none; }
@keyframes spin { to{transform:rotate(360deg)} }

/* SUB BUTTONS ROW */
#subBtns { display:flex; gap:8px; }
.sub-btn {
  flex:1; background:rgba(255,255,255,.12); border:1.5px solid rgba(255,255,255,.2);
  border-radius:13px; padding:12px 6px; color:white; font-size:.88rem; font-weight:700;
  font-family:inherit; cursor:pointer; display:flex; align-items:center;
  justify-content:center; gap:5px; transition:all .15s; min-height:48px;
}
.sub-btn:hover { background:rgba(255,255,255,.22); }
.sub-btn.active { background:var(--blue); border-color:var(--blue); }

/* AUTO TIMER */
#autoIndicator {
  position:absolute; bottom:168px; right:14px;
  background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.15);
  border-radius:99px; padding:5px 12px;
  color:rgba(255,255,255,.6); font-size:.82rem;
  display:flex; align-items:center; gap:6px; pointer-events:none;
}
#autoTimer { width:28px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden; }
#autoTimerFill { height:100%; background:var(--green); border-radius:2px; transition:width .1s linear; }

/* ─ TOOLTIP ─ */
#tooltip {
  position:fixed; z-index:200; background:rgba(8,18,38,.97);
  border-radius:18px; padding:20px 22px; width:88%; max-width:320px;
  border:1px solid rgba(255,255,255,.12); display:none; animation:fadeUp .2s ease;
  left:50%; top:50%; transform:translate(-50%,-50%); pointer-events:auto;
}
@keyframes fadeUp { from{opacity:0;transform:translate(-50%,-54%)} to{opacity:1;transform:translate(-50%,-50%)} }
.tt-term { color:var(--yellow); font-size:1.1rem; font-weight:900; margin-bottom:8px; }
.tt-desc { color:rgba(255,255,255,.88); font-size:1rem; line-height:1.65; white-space:pre-line; }
.tt-close { position:absolute; top:12px; right:14px; background:none; border:none;
  color:rgba(255,255,255,.45); font-size:1.3rem; cursor:pointer; padding:4px; }
.tt-tts { margin-top:12px; background:rgba(255,255,255,.1); border:none; border-radius:10px;
  color:white; font-size:.95rem; font-family:inherit; padding:9px 16px; cursor:pointer; width:100%; }

/* shimmer */
.shimmer { background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.14) 50%,rgba(255,255,255,.04) 100%);
  background-size:200% 100%; animation:sh 1.2s infinite; border-radius:7px; height:1.1em; margin:5px 0; }
@keyframes sh { 0%{background-position:200%} 100%{background-position:-200%} }
</style>
</head>
<body>

<div id="brightnessOverlay"></div>

<!-- CAMERA -->
<div id="cameraLayer">
  <video id="videoEl" autoplay playsinline muted></video>
  <canvas id="canvasEl"></canvas>
</div>

<!-- NO CAM -->
<div id="noCamMsg">
  <p style="font-size:2.5rem">📷</p>
  <p>카메라를 사용할 수 없어요.<br>브라우저에서 카메라 권한을<br>허용해 주세요.</p>
</div>

<!-- START SCREEN -->
<div id="startScreen">
  <div class="app-icon">📷</div>
  <h1>키오스크<br>도우미</h1>
  <p>카메라로 키오스크 화면을 비추면<br>AI가 무엇을 눌러야 하는지<br>알려드려요 😊</p>

  <div style="color:rgba(255,255,255,.6);font-size:1rem;font-weight:700;">지금 어디 계세요?</div>
  <div class="situation-grid" id="sitGrid">
    <button class="sit-btn" onclick="selectSit(this,'burger')"><span class="s-icon">🍔</span>햄버거 가게</button>
    <button class="sit-btn" onclick="selectSit(this,'cafe')"><span class="s-icon">☕</span>카페</button>
    <button class="sit-btn" onclick="selectSit(this,'train')"><span class="s-icon">🚆</span>기차·버스</button>
    <button class="sit-btn" onclick="selectSit(this,'hospital')"><span class="s-icon">🏥</span>병원</button>
    <button class="sit-btn" onclick="selectSit(this,'bank')"><span class="s-icon">🏦</span>ATM·은행</button>
    <button class="sit-btn" onclick="selectSit(this,'other')"><span class="s-icon">📍</span>기타</button>
  </div>

  <button id="startBtn" onclick="startCamera()">📷 카메라 켜기</button>
</div>

<!-- POINTER -->
<div id="aiPointer">
  <div class="ptr-finger">👆</div>
  <div class="ptr-ring"></div>
</div>

<!-- UI OVERLAY -->
<div id="uiOverlay">

  <!-- TOP -->
  <div id="topBar">
    <div class="app-name"><div class="live-dot"></div>키오스크 도우미</div>
    <div id="statusBadge">준비중...</div>
    <div id="topControls">
      <button class="top-ctrl-btn" onclick="toggleHistory()" title="기록">📋</button>
      <button class="top-ctrl-btn" onclick="toggleBrightness()" title="밝기">☀️</button>
      <button class="top-ctrl-btn" onclick="toggleFont()" id="fontCtrl" title="글자크기">가</button>
    </div>
  </div>

  <!-- BRIGHTNESS PANEL -->
  <div id="brightnessPanel">
    <div class="br-label">
      ☀️ 화면 밝기 조절
      <button class="br-close" onclick="toggleBrightness()">✕</button>
    </div>
    <input type="range" id="brightnessSlider" min="0" max="70" value="0"
      oninput="applyBrightness(this.value)">
    <div style="color:rgba(255,255,255,.5);font-size:.85rem;margin-top:8px;">
      ← 밝게 &nbsp;&nbsp;&nbsp; 어둡게 →
    </div>
  </div>

  <!-- HISTORY PANEL -->
  <div id="historyPanel" id="historyPanel"></div>

  <!-- AI BUBBLE -->
  <div id="aiBubble">
    <div class="bubble-hd">
      <div class="b-avatar">🤖</div>
      <span class="b-label">AI 안내</span>
    </div>
    <div id="bubbleText"></div>
    <div class="bubble-actions">
      <button class="b-act-btn" onclick="speakCurrent()">🔊 읽어주기</button>
      <button class="b-act-btn" onclick="showLastResult()">↩ 이전 결과</button>
    </div>
  </div>

  <!-- AUTO TIMER -->
  <div id="autoIndicator">
    <span>자동분석</span>
    <div id="autoTimer"><div id="autoTimerFill" style="width:100%"></div></div>
  </div>

  <!-- BOTTOM -->
  <div id="bottomArea">
    <div id="questionChips"></div>
    <div id="mainBtns">
      <button id="analyzeBtn" onclick="analyzeNow()">
        <div class="btn-spin" id="btnSpin"></div>
        <span id="btnTxt">🔍 지금 분석하기</span>
      </button>
    </div>
    <div id="subBtns">
      <button class="sub-btn" onclick="speakCurrent()">🔊 읽어주기</button>
      <button class="sub-btn" onclick="showLastResult()">↩ 이전 결과</button>
      <button class="sub-btn" onclick="toggleFont()" id="fontBtn2">가+ 크게</button>
    </div>
  </div>

</div>

<!-- TOOLTIP -->
<div id="tooltip">
  <button class="tt-close" onclick="closeTooltip()">✕</button>
  <div class="tt-term" id="ttTerm"></div>
  <div class="tt-desc" id="ttDesc"></div>
  <button class="tt-tts" onclick="speakTooltip()">🔊 소리로 듣기</button>
</div>

<script>
// ── TERMS ──
const TERMS = {
  '멤버십':     '포인트를 쌓거나 할인받는 회원 카드예요.\n없으시면 "없음" 또는 "건너뛰기"를 누르시면 돼요! 😊',
  '포인트':     '살 때마다 쌓이는 점수예요. 나중에 할인에 쓸 수 있어요.\n없으시면 그냥 다음으로 넘어가시면 돼요!',
  '통신사 할인': 'KT·SKT·LG 같은 핸드폰 회사 할인이에요.\n해당 없으시면 "해당없음"을 누르세요!',
  '쿠폰':      '할인해주는 코드나 종이예요.\n없으시면 "없음"을 누르고 넘어가시면 돼요!',
  'IC칩':      '카드 앞면의 금색 네모 부분이에요.\n그 부분이 안쪽으로 향하게 넣으시면 됩니다!',
  'NFC':       '카드나 폰을 가져다 대면 결제되는 방식이에요.',
  '세트':      '버거+감자튀김+음료 묶음 메뉴예요. 단품보다 보통 저렴해요!',
  '영수증':    '얼마를 냈는지 적힌 종이예요.\n원하시면 "예"를 누르시면 받을 수 있어요!',
  'QR코드':    '핸드폰 카메라로 찍는 네모난 바코드예요.',
  'For Here':  '매장 안에서 먹는다는 뜻이에요 🪑',
  'To Go':     '포장해서 가져간다는 뜻이에요 🛍️',
  '단품':      '음식 하나만 따로 주문하는 거예요.',
};
const FIXED_CHIPS = [
  { label:'멤버십이 뭔가요?',  term:'멤버십' },
  { label:'통신사 할인?',     term:'통신사 할인' },
  { label:'포인트?',         term:'포인트' },
  { label:'쿠폰 없어요',     term:'쿠폰' },
  { label:'카드 넣는 법',    term:'IC칩' },
];
const SIT_HINTS = {
  burger:   '햄버거 가게 키오스크예요. For Here/To Go, 세트/단품 선택이 자주 나와요.',
  cafe:     '카페 키오스크예요. 음료 사이즈, 옵션(샷 추가 등) 선택이 나올 수 있어요.',
  train:    '기차·버스 터미널이에요. 출발역, 도착역, 날짜·시간 선택 순서로 진행돼요.',
  hospital: '병원 무인 접수기예요. 진료카드나 주민번호 입력 후 진료과 선택이 나와요.',
  bank:     'ATM 기기예요. 카드 넣기 → 비밀번호 → 출금/입금/이체 선택 순서예요.',
  other:    '키오스크 화면을 분석할게요.',
};

// ── STATE ──
let isAnalyzing = false;
let autoSeconds = 8;
let timerLeft = autoSeconds;
let timerInterval = null;
let largeFontMode = false;
let currentSit = 'other';
let analysisHistory = []; // { time, text, pointer }
let lastResult = null;
let currentBubbleText = '';
let ttsEnabled = true;

// ── SITUATION ──
function selectSit(el, sit) {
  document.querySelectorAll('.sit-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  currentSit = sit;
}

// ── CAMERA ──
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' }, width:{ ideal:1280 }, height:{ ideal:720 } },
      audio:false
    });
    const video = document.getElementById('videoEl');
    video.srcObject = stream;
    await video.play();
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('uiOverlay').style.display = 'block';
    initChips();
    startAutoAnalysis();
    showBubble('📷 카메라가 켜졌어요!\n\n키오스크 화면에 가져다 대시면\nAI가 무엇을 눌러야 하는지 알려드릴게요 😊\n\n천천히 하셔도 괜찮아요!', false);
    speak('카메라가 켜졌어요. 키오스크 화면에 가져다 대주세요.');
  } catch(e) {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('noCamMsg').style.display = 'flex';
  }
}

// ── CAPTURE ──
function captureFrame() {
  const video = document.getElementById('videoEl');
  const canvas = document.getElementById('canvasEl');
  canvas.width = video.videoWidth || 640;
  canvas.height = video.videoHeight || 480;
  canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.65).split(',')[1];
}

// ── ANALYZE ──
async function analyzeNow() {
  if (isAnalyzing) return;
  resetAutoTimer();
  await doAnalysis();
}

async function doAnalysis() {
  if (isAnalyzing) return;
  isAnalyzing = true;
  setLoadingUI(true);
  hidePointer();
  closePanels();

  let imageB64;
  try { imageB64 = captureFrame(); }
  catch(e) { isAnalyzing = false; setLoadingUI(false); return; }

  const sitHint = SIT_HINTS[currentSit] || '';
  const prompt = `당신은 어르신을 위한 키오스크 도우미입니다.
상황 힌트: ${sitHint}

이 화면을 보고 JSON만 출력하세요 (다른 텍스트 없이):
{"action":"지금 눌러야 할 버튼 한 문장","explain":"쉬운 말 2문장 설명 (존댓말, 따뜻하게, 이모지)","pointer":{"x":0~1,"y":0~1},"unknown_terms":["모를단어 최대3개"],"cheer":"짧은 응원"}

pointer는 눌러야 할 버튼의 이미지 내 상대좌표 (왼쪽위=0,0/오른쪽아래=1,1). 없으면 null.
키오스크가 아니거나 잘 안 보이면:
{"action":"잘 안 보여요","explain":"키오스크 화면을 가까이 대주세요 📷","pointer":null,"unknown_terms":[],"cheer":"천천히 해도 괜찮아요!"}`;

  let parsed = null;
  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 25000);
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST', signal:ctrl.signal,
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          model:'claude-sonnet-4-20250514', max_tokens:500,
          messages:[{ role:'user', content:[
            { type:'image', source:{ type:'base64', media_type:'image/jpeg', data:imageB64 } },
            { type:'text', text:prompt }
          ]}]
        })
      });
      clearTimeout(t);
      const data = await res.json();
      const raw = data.content?.[0]?.text || '';
      try { parsed = JSON.parse(raw.replace(/```json|```/g,'').trim()); }
      catch { parsed = {action:'분석 오류',explain:'다시 눌러보세요 😊',pointer:null,unknown_terms:[],cheer:'괜찮아요!'}; }
      break;
    } catch(e) {
      if (attempt < 3) {
        showBubble(`연결 중... (${attempt}/3번 시도중)\n잠깐만 기다려 주세요 😊`, false);
        await new Promise(r => setTimeout(r, 2000 * attempt));
      } else {
        showBubble('연결이 안 됐어요 😔\n"지금 분석하기"를 다시 눌러보세요!', false);
        speak('연결이 안 됐어요. 분석하기 버튼을 다시 눌러보세요.');
      }
    }
  }

  if (parsed) renderResult(parsed);
  isAnalyzing = false;
  setLoadingUI(false);
}

// ── RENDER ──
function renderResult(d) {
  const text = `👆 ${d.action}\n\n${d.explain}\n\n✨ ${d.cheer}`;
  showBubble(text, false);
  currentBubbleText = `${d.action}. ${d.explain} ${d.cheer}`;
  document.getElementById('statusBadge').textContent = '✅ 분석 완료';

  if (d.pointer) showPointer(d.pointer.x, d.pointer.y);
  else hidePointer();

  renderChips(d.unknown_terms || []);

  // 기록 저장
  const now = new Date();
  const timeStr = `${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
  lastResult = { time:timeStr, text, pointer:d.pointer };
  analysisHistory.unshift(lastResult);
  if (analysisHistory.length > 10) analysisHistory.pop();

  // TTS 자동 읽기
  speak(currentBubbleText);
}

// ── TTS ──
function speak(text) {
  if (!ttsEnabled) return;
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utt = new SpeechSynthesisUtterance(text.replace(/[👆✨😊📷🔍]/g,''));
  utt.lang = 'ko-KR';
  utt.rate = 0.88;
  utt.pitch = 1.05;
  window.speechSynthesis.speak(utt);
}

function speakCurrent() {
  if (currentBubbleText) speak(currentBubbleText);
}

function speakTooltip() {
  const term = document.getElementById('ttTerm').textContent.replace('❓ ','');
  const desc = document.getElementById('ttDesc').textContent;
  speak(`${term}. ${desc}`);
}

// ── LAST RESULT ──
function showLastResult() {
  if (!lastResult) {
    showBubble('아직 분석한 결과가 없어요.\n먼저 분석하기를 눌러주세요!', false);
    return;
  }
  showBubble(lastResult.text, false);
  if (lastResult.pointer) showPointer(lastResult.pointer.x, lastResult.pointer.y);
  speak(currentBubbleText);
}

// ── HISTORY ──
function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  const bubble = document.getElementById('aiBubble');
  const brPanel = document.getElementById('brightnessPanel');
  brPanel.style.display = 'none';
  if (panel.style.display === 'flex') {
    panel.style.display = 'none';
    bubble.style.display = currentBubbleText ? 'block' : 'none';
  } else {
    bubble.style.display = 'none';
    renderHistory();
    panel.style.display = 'flex';
  }
}

function renderHistory() {
  const panel = document.getElementById('historyPanel');
  panel.innerHTML = '';
  if (analysisHistory.length === 0) {
    panel.innerHTML = '<div style="color:rgba(255,255,255,.4);text-align:center;padding:20px;font-size:1rem;">아직 분석 기록이 없어요</div>';
    return;
  }
  analysisHistory.forEach((h, i) => {
    const div = document.createElement('div');
    div.className = 'hist-item';
    div.innerHTML = `<div class="hist-time">${h.time}</div><div class="hist-text">${h.text}</div>`;
    const btn = document.createElement('button');
    btn.className = 'hist-replay';
    btn.textContent = '🔊 다시 읽기';
    btn.onclick = () => speak(h.text.replace(/[👆✨😊]/g,''));
    div.appendChild(btn);
    panel.appendChild(div);
  });
}

// ── BRIGHTNESS ──
function toggleBrightness() {
  const panel = document.getElementById('brightnessPanel');
  const histPanel = document.getElementById('historyPanel');
  histPanel.style.display = 'none';
  document.getElementById('aiBubble').style.display = currentBubbleText ? 'block' : 'none';
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}

function applyBrightness(val) {
  document.getElementById('brightnessOverlay').style.opacity = val / 100;
}

function closePanels() {
  document.getElementById('historyPanel').style.display = 'none';
  document.getElementById('brightnessPanel').style.display = 'none';
}

// ── BUBBLE ──
function showBubble(text, loading) {
  const bubble = document.getElementById('aiBubble');
  const el = document.getElementById('bubbleText');
  bubble.style.display = 'block';
  if (loading) {
    el.innerHTML = '<div class="shimmer" style="width:80%"></div><div class="shimmer" style="width:55%"></div>';
  } else {
    el.textContent = text;
  }
}

// ── POINTER ──
function showPointer(rx, ry) {
  const ptr = document.getElementById('aiPointer');
  const W = window.innerWidth, H = window.innerHeight;
  ptr.style.display = 'flex';
  ptr.style.position = 'fixed';
  ptr.style.left = Math.max(8, Math.min(W-60, Math.round(W*rx)-20)) + 'px';
  ptr.style.top  = Math.max(8, Math.min(H-80, Math.round(H*ry)-60)) + 'px';
  ptr.style.zIndex = 20;
}
function hidePointer() { document.getElementById('aiPointer').style.display = 'none'; }

// ── CHIPS ──
function initChips() { renderChips([]); }
function renderChips(aiTerms) {
  const c = document.getElementById('questionChips');
  c.innerHTML = '';
  FIXED_CHIPS.forEach(fc => {
    const b = document.createElement('button');
    b.className = 'q-chip';
    b.textContent = '❓ ' + fc.label;
    b.onclick = () => showTooltip(fc.term, TERMS[fc.term]);
    c.appendChild(b);
  });
  aiTerms.forEach(term => {
    const b = document.createElement('button');
    b.className = 'q-chip ai-chip';
    b.textContent = '❓ ' + term;
    b.onclick = () => TERMS[term] ? showTooltip(term, TERMS[term]) : askAI(term);
    c.appendChild(b);
  });
}

// ── TOOLTIP ──
function showTooltip(term, desc) {
  document.getElementById('ttTerm').textContent = '❓ ' + term;
  document.getElementById('ttDesc').textContent = desc;
  document.getElementById('tooltip').style.display = 'block';
}
function closeTooltip() { document.getElementById('tooltip').style.display = 'none'; }

async function askAI(term) {
  showTooltip(term, '설명 가져오는 중...');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ model:'claude-sonnet-4-20250514', max_tokens:200,
        messages:[{role:'user',content:`어르신에게 키오스크 단어 "${term}"를 쉽게 2~3문장 설명. 존댓말, 이모지 포함.`}]
      })
    });
    const data = await res.json();
    const desc = data.content?.[0]?.text || '설명 없음';
    document.getElementById('ttDesc').textContent = desc;
    TERMS[term] = desc;
  } catch { document.getElementById('ttDesc').textContent = '설명을 가져오지 못했어요 😔'; }
}

// ── AUTO ANALYSIS ──
function startAutoAnalysis() {
  timerLeft = autoSeconds;
  timerInterval = setInterval(() => {
    timerLeft -= 0.1;
    if (timerLeft <= 0) { timerLeft = autoSeconds; if (!isAnalyzing) doAnalysis(); }
    document.getElementById('autoTimerFill').style.width = (timerLeft/autoSeconds*100)+'%';
  }, 100);
}
function resetAutoTimer() { timerLeft = autoSeconds; }

// ── UI ──
function setLoadingUI(on) {
  document.getElementById('analyzeBtn').disabled = on;
  document.getElementById('btnSpin').style.display = on ? 'block' : 'none';
  document.getElementById('btnTxt').textContent = on ? '분석중...' : '🔍 지금 분석하기';
  document.getElementById('statusBadge').textContent = on ? '🔍 분석중...' : '✅ 분석 완료';
  if (on) showBubble('', true);
}

// ── FONT ──
function toggleFont() {
  largeFontMode = !largeFontMode;
  document.documentElement.style.fontSize = largeFontMode ? '19px' : '16px';
  const label = largeFontMode ? '가- 작게' : '가+ 크게';
  document.getElementById('fontBtn2').textContent = label;
  document.getElementById('fontCtrl').textContent = largeFontMode ? '가-' : '가+';
}
</script>
